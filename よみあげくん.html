<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>よみあげくん</title>
<style>
:root{
  --bg:#f3f1ec; --surface:#fffefb; --ink:#23262b; --muted:#6b7078; --line:#d9d5cb;
  --accent:#1f5f8b; --accent-ink:#ffffff; --warn:#a4452c;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16191d; --surface:#1f2329; --ink:#e8e6e1; --muted:#9aa0a8; --line:#363c44;
    --accent:#6fb4e3; --accent-ink:#0e1a24; --warn:#e8896f; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#16191d; --surface:#1f2329; --ink:#e8e6e1; --muted:#9aa0a8; --line:#363c44;
  --accent:#6fb4e3; --accent-ink:#0e1a24; --warn:#e8896f; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Hiragino Sans","Yu Gothic UI","Noto Sans JP","Meiryo",system-ui,sans-serif;line-height:1.7}
main{max-width:720px;margin:0 auto;padding:28px 18px 48px}
h1{font-size:1.6rem;margin:0 0 4px;letter-spacing:.04em}
.lead{margin:0 0 20px;color:var(--muted);font-size:.95rem}
label{display:block;font-size:.85rem;font-weight:600;margin-bottom:4px}
textarea{width:100%;min-height:200px;resize:vertical;padding:14px;font:inherit;font-size:1.05rem;
  color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:6px}
textarea:focus,select:focus,button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:.8rem;margin:4px 0 18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px;margin-bottom:18px}
.grid .full{grid-column:1/-1}
select{width:100%;padding:9px 10px;font:inherit;color:var(--ink);background:var(--surface);
  border:1.5px solid var(--line);border-radius:6px}
.slider{display:flex;align-items:center;gap:12px}
.slider input{flex:1;accent-color:var(--accent)}
.slider output{min-width:3.6em;text-align:right;font-variant-numeric:tabular-nums;font-size:.9rem}
.buttons{display:flex;gap:10px;flex-wrap:wrap}
button{font:inherit;font-weight:600;padding:12px 22px;border-radius:6px;border:1.5px solid var(--accent);
  background:transparent;color:var(--accent);cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-ink);flex:1 1 160px;font-size:1.05rem}
button:disabled{opacity:.4;cursor:not-allowed}
.status{margin-top:14px;min-height:1.6em;font-size:.88rem;color:var(--muted)}
.status.err{color:var(--warn)}
.bar{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.note{margin-top:22px;font-size:.8rem;color:var(--muted)}
@media (max-width:520px){.grid{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<main>
  <h1>よみあげくん</h1>
  <p class="lead">文字を入力して「読み上げ」を押すと、音声で読んでくれます。</p>

  <label for="text">読み上げるテキスト</label>
  <textarea id="text" placeholder="ここに文章を入力してください（文字数の制限はありません）"></textarea>
  <div class="meta"><span id="count">0文字</span><span>Ctrl / ⌘ + Enter でも読み上げ</span></div>

  <div class="grid">
    <div>
      <label for="lang">言語</label>
      <select id="lang"></select>
    </div>
    <div>
      <label for="gender">声の種類</label>
      <select id="gender">
        <option value="any">指定なし</option>
        <option value="female">女性の声</option>
        <option value="male">男性の声</option>
      </select>
    </div>
    <div class="full">
      <label for="voice">音声</label>
      <select id="voice"></select>
    </div>
    <div>
      <label for="rate">速さ</label>
      <div class="slider"><input id="rate" type="range" min="0.5" max="2" step="0.1" value="1"><output id="rateOut">1.0倍</output></div>
    </div>
    <div>
      <label for="pitch">声の高さ</label>
      <div class="slider"><input id="pitch" type="range" min="0.2" max="2" step="0.1" value="1"><output id="pitchOut">1.0</output></div>
    </div>
  </div>

  <div class="buttons">
    <button id="speak" class="primary" type="button">読み上げ</button>
    <button id="pause" type="button" disabled>一時停止</button>
    <button id="stop" type="button" disabled>停止</button>
  </div>
  <div class="bar" aria-hidden="true"><i id="prog"></i></div>
  <div id="status" class="status" role="status" aria-live="polite"></div>

  <p class="note">音声はお使いのブラウザ・端末に入っているものを使います。男女の区別は音声の名前から判定しているため、完全ではありません。声の高さを変えると男性寄り・女性寄りの印象を調整できます。</p>
</main>

<script>
(function(){
  var synth = window.speechSynthesis;
  var $ = function(id){return document.getElementById(id)};
  var text=$('text'), langSel=$('lang'), genderSel=$('gender'), voiceSel=$('voice');
  var rate=$('rate'), pitch=$('pitch'), statusEl=$('status'), prog=$('prog');
  var speakBtn=$('speak'), pauseBtn=$('pause'), stopBtn=$('stop');
  var voices=[], queueId=0, paused=false;

  if(!synth || typeof SpeechSynthesisUtterance==='undefined'){
    setStatus('このブラウザは音声読み上げに対応していません。Chrome・Edge・Safariなどでお試しください。',true);
    speakBtn.disabled=true; return;
  }

  function setStatus(msg,err){statusEl.textContent=msg;statusEl.className='status'+(err?' err':'')}

  var FEMALE=/female|kyoko|haruka|ayumi|sayaka|nanami|mizuki|o-ren|samantha|victoria|karen|moira|tessa|zira|hazel|susan|jenny|aria|michelle|ting-ting|mei-jia|sin-ji|yuna|amelie|anna|helena|paulina|monica|alice|sara|ioana|kanya|google 日本語|女/i;
  var MALE=/\bmale\b|otoya|ichiro|keita|takumi|daniel|alex\b|fred|\btom\b|david|mark\b|james|\bguy\b|eric|ryan|thomas|jorge|diego|luca|yuri|xander|男/i;
  function genderOf(v){
    var n=v.name;
    if(/female/i.test(n)) return 'female';
    if(MALE.test(n)) return 'male';
    if(FEMALE.test(n)) return 'female';
    return 'unknown';
  }

  var dn; try{dn=new Intl.DisplayNames(['ja'],{type:'language'})}catch(e){}
  function langLabel(code){
    try{return (dn&&dn.of(code))||code}catch(e){return code}
  }

  function loadVoices(){
    voices=synth.getVoices();
    if(!voices.length){
      if(!langSel.options.length){
        [['ja-JP','日本語'],['en-US','英語（米国）'],['en-GB','英語（英国）'],['zh-CN','中国語'],['ko-KR','韓国語'],['fr-FR','フランス語'],['de-DE','ドイツ語'],['es-ES','スペイン語'],['it-IT','イタリア語']].forEach(function(a){
          var o=document.createElement('option'); o.value=a[0]; o.textContent=a[1]+'（'+a[0]+'）'; langSel.appendChild(o);
        });
        fillVoices();
      }
      return;
    }
    var prev=langSel.value;
    var langs=[]; voices.forEach(function(v){if(langs.indexOf(v.lang)<0) langs.push(v.lang)});
    langs.sort(function(a,b){
      var ja=function(x){return /^ja/i.test(x)?0:1};
      return ja(a)-ja(b)||a.localeCompare(b);
    });
    langSel.innerHTML='';
    langs.forEach(function(l){
      var o=document.createElement('option'); o.value=l; o.textContent=langLabel(l)+'（'+l+'）'; langSel.appendChild(o);
    });
    if(prev&&langs.indexOf(prev)>=0) langSel.value=prev;
    fillVoices();
  }

  function fillVoices(){
    var list=voices.filter(function(v){return v.lang===langSel.value});
    var g=genderSel.value, note='';
    if(g!=='any'){
      var f=list.filter(function(v){return genderOf(v)===g});
      if(f.length) list=f; else note='この言語には'+(g==='female'?'女性':'男性')+'と判定できる音声がないため、すべて表示しています。声の高さで調整してください。';
    }
    voiceSel.innerHTML='';
    var auto=document.createElement('option'); auto.value=''; auto.textContent='自動（ブラウザの標準音声）'; voiceSel.appendChild(auto);
    var matched=(g!=='any'&&!note);
    list.forEach(function(v){
      var o=document.createElement('option'); o.value=v.name+'||'+v.lang;
      var gl=genderOf(v); o.textContent=v.name+(gl==='female'?'（女性）':gl==='male'?'（男性）':'');
      voiceSel.appendChild(o);
    });
    if(matched&&list.length) voiceSel.selectedIndex=1;
    if(note) setStatus(note);
  }

  function currentVoice(){
    var key=voiceSel.value; if(!key) return null;
    for(var i=0;i<voices.length;i++){ if(voices[i].name+'||'+voices[i].lang===key) return voices[i]; }
    return null;
  }

  loadVoices();
  if(synth.onvoiceschanged!==undefined) synth.onvoiceschanged=loadVoices;
  var tries=0, poll=setInterval(function(){loadVoices(); if(voices.length||++tries>20) clearInterval(poll)},300);

  langSel.addEventListener('change',fillVoices);
  genderSel.addEventListener('change',fillVoices);
  rate.addEventListener('input',function(){$('rateOut').textContent=Number(rate.value).toFixed(1)+'倍'});
  pitch.addEventListener('input',function(){$('pitchOut').textContent=Number(pitch.value).toFixed(1)});
  text.addEventListener('input',function(){$('count').textContent=text.value.length.toLocaleString('ja-JP')+'文字'});
  text.addEventListener('keydown',function(e){if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();speak()}});

  // 長文でも途切れないよう、文の区切りで分割して順番に読む
  function split(s){
    var parts=s.match(/[^。！？!?．.\n]+[。！？!?．.]*\n*|\n+/g)||[s];
    var out=[];
    parts.forEach(function(p){
      p=p.trim(); if(!p) return;
      while(p.length>180){
        var cut=p.lastIndexOf('、',180); if(cut<40) cut=p.lastIndexOf(',',180); if(cut<40) cut=p.lastIndexOf(' ',180); if(cut<40) cut=180;
        out.push(p.slice(0,cut+1)); p=p.slice(cut+1).trim();
      }
      if(p) out.push(p);
    });
    return out;
  }

  function setPlaying(on){
    pauseBtn.disabled=!on; stopBtn.disabled=!on;
    if(!on){paused=false;pauseBtn.textContent='一時停止'}
  }

  function speak(){
    var s=text.value.trim();
    if(!s){setStatus('テキストを入力してください。',true);text.focus();return}
    var id=++queueId, chunks=split(s), i=0, v=currentVoice(), busy=synth.speaking||synth.pending;
    synth.cancel(); try{synth.resume()}catch(e){}
    setPlaying(true); prog.style.width='0'; setStatus('準備中…');

    function fail(msg){queueId++;synth.cancel();setPlaying(false);setStatus(msg,true)}

    function playChunk(useVoice){
      if(id!==queueId) return;
      if(i>=chunks.length){setPlaying(false);prog.style.width='100%';setStatus('読み上げが終わりました。');return}
      var done=false, timer=null, u=new SpeechSynthesisUtterance(chunks[i]);
      if(useVoice&&v){u.voice=v;u.lang=v.lang}else{u.lang=langSel.value||'ja-JP'}
      u.rate=Number(rate.value); u.pitch=Number(pitch.value);
      function advance(){
        if(done) return; done=true; clearTimeout(timer);
        if(id!==queueId) return;
        i++; prog.style.width=Math.round(i/chunks.length*100)+'%'; playChunk(useVoice);
      }
      u.onstart=function(){setStatus('読み上げ中… '+(i+1)+' / '+chunks.length)};
      u.onend=advance;
      u.onerror=function(e){
        if(done||id!==queueId) return;
        if(e.error==='canceled'||e.error==='interrupted') return;
        done=true; clearTimeout(timer);
        if(e.error==='not-allowed'){fail('ブラウザが音声の再生を許可していません。もう一度ボタンを押してください。');return}
        if(useVoice&&v){useVoice=false; setStatus('選んだ音声が使えないため、標準の音声で読み上げます。'); setTimeout(function(){playChunk(false)},50); return}
        fail('読み上げに失敗しました（'+e.error+'）。ブラウザの音声設定を確認してください。');
      };
      // 終了通知が来ないブラウザ向けの保険
      timer=setTimeout(function(){
        if(done||id!==queueId||paused) return;
        done=true; synth.cancel(); i++;
        setTimeout(function(){playChunk(useVoice)},60);
      },15000+chunks[i].length*400/Number(rate.value));
      setStatus('読み上げ中… '+(i+1)+' / '+chunks.length);
      synth.speak(u);
    }
    // Chromeはcancel直後のspeakが無視されることがあるため少し待つ
    if(busy) setTimeout(function(){playChunk(true)},120); else playChunk(true);
  }

  speakBtn.addEventListener('click',speak);
  stopBtn.addEventListener('click',function(){queueId++;synth.cancel();setPlaying(false);prog.style.width='0';setStatus('停止しました。')});
  pauseBtn.addEventListener('click',function(){
    if(!paused){synth.pause();paused=true;pauseBtn.textContent='再開';setStatus('一時停止中')}
    else{synth.resume();paused=false;pauseBtn.textContent='一時停止';setStatus('読み上げ中…')}
  });
  window.addEventListener('beforeunload',function(){synth.cancel()});
})();
</script>
</body>
</html>
