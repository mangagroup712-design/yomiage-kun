<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>よみあげくん</title>
<style>
:root{
  --bg:#f3f1ec; --surface:#fffefb; --ink:#23262b; --muted:#6b7078; --line:#d9d5cb;
  --accent:#1f5f8b; --accent-ink:#ffffff; --warn:#a4452c;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16191d; --surface:#1f2329; --ink:#e8e6e1; --muted:#9aa0a8; --line:#363c44;
    --accent:#6fb4e3; --accent-ink:#0e1a24; --warn:#e8896f; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#16191d; --surface:#1f2329; --ink:#e8e6e1; --muted:#9aa0a8; --line:#363c44;
  --accent:#6fb4e3; --accent-ink:#0e1a24; --warn:#e8896f; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Hiragino Sans","Yu Gothic UI","Noto Sans JP","Meiryo",system-ui,sans-serif;line-height:1.7}
main{max-width:720px;margin:0 auto;padding:28px 18px 48px}
h1{font-size:1.6rem;margin:0 0 4px;letter-spacing:.04em}
.lead{margin:0 0 20px;color:var(--muted);font-size:.95rem}
label{display:block;font-size:.85rem;font-weight:600;margin-bottom:4px}
textarea{width:100%;min-height:200px;resize:vertical;padding:14px;font:inherit;font-size:1.05rem;
  color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:6px}
textarea:focus,select:focus,button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:.8rem;margin:4px 0 18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px;margin-bottom:18px}
.grid .full{grid-column:1/-1}
select{width:100%;padding:9px 10px;font:inherit;color:var(--ink);background:var(--surface);
  border:1.5px solid var(--line);border-radius:6px}
.slider{display:flex;align-items:center;gap:12px}
.slider input{flex:1;accent-color:var(--accent)}
.slider output{min-width:3.6em;text-align:right;font-variant-numeric:tabular-nums;font-size:.9rem}
.hint{font-size:.78rem;color:var(--muted);margin:3px 0 0}
.buttons{display:flex;gap:10px;flex-wrap:wrap}
button{font:inherit;font-weight:600;padding:12px 22px;border-radius:6px;border:1.5px solid var(--accent);
  background:transparent;color:var(--accent);cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-ink);flex:1 1 160px;font-size:1.05rem}
button:disabled,input:disabled{opacity:.4;cursor:not-allowed}
.status{margin-top:14px;min-height:1.6em;font-size:.88rem;color:var(--muted)}
.status.err{color:var(--warn)}
.bar{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.note{margin-top:22px;font-size:.8rem;color:var(--muted)}
@media (max-width:520px){.grid{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>
</head>
<body>
<main>
  <h1>よみあげくん</h1>
  <p class="lead">文字を入力して「読み上げ」を押すと、選んだ言語の音声で読んでくれます。</p>

  <label for="text">読み上げるテキスト</label>
  <textarea id="text" placeholder="ここに文章を入力してください（文字数の制限はありません）"></textarea>
  <div class="meta"><span id="count">0文字</span><span>Ctrl / ⌘ + Enter でも読み上げ</span></div>

  <div class="grid">
    <div>
      <label for="lang">読み上げる言語</label>
      <select id="lang"></select>
    </div>
    <div>
      <label for="gender">声の種類</label>
      <select id="gender">
        <option value="any">指定なし</option>
        <option value="female">女性の声</option>
        <option value="male">男性の声</option>
      </select>
    </div>
    <div class="full">
      <label for="engine">音声の取得方法</label>
      <select id="engine">
        <option value="auto">自動（オンライン音声を優先・失敗したら切り替え）</option>
        <option value="se">オンライン音声（男女の声あり）</option>
        <option value="gt">オンライン音声（Google翻訳）</option>
        <option value="br">この端末の音声（オフライン可）</option>
      </select>
    </div>
    <div class="full" id="voiceRow" hidden>
      <label for="voice">端末の音声</label>
      <select id="voice"></select>
    </div>
    <div>
      <label for="rate">速さ</label>
      <div class="slider"><input id="rate" type="range" min="0.5" max="2" step="0.1" value="1"><output id="rateOut">1.0倍</output></div>
    </div>
    <div>
      <label for="pitch">声の高さ</label>
      <div class="slider"><input id="pitch" type="range" min="0.2" max="2" step="0.1" value="1" disabled><output id="pitchOut">1.0</output></div>
      <p class="hint">「この端末の音声」のときだけ使えます</p>
    </div>
  </div>

  <div class="buttons">
    <button id="speak" class="primary" type="button">読み上げ</button>
    <button id="pause" type="button" disabled>一時停止</button>
    <button id="stop" type="button" disabled>停止</button>
  </div>
  <div class="bar" aria-hidden="true"><i id="prog"></i></div>
  <div id="status" class="status" role="status" aria-live="polite"></div>

  <p class="note">オンライン音声はインターネット接続が必要で、入力した文章は音声を作るために外部のサービス（StreamElements、Google翻訳）へ送信されます。機密情報は入力しないでください。男女の声は言語によって用意がなく、片方だけの場合があります。</p>
</main>

<script>
(function(){
  var synth=window.speechSynthesis, hasBr=!!synth&&typeof SpeechSynthesisUtterance!=='undefined';
  var $=function(id){return document.getElementById(id)};
  var text=$('text'),langSel=$('lang'),genderSel=$('gender'),engSel=$('engine'),voiceSel=$('voice'),voiceRow=$('voiceRow');
  var rate=$('rate'),pitch=$('pitch'),statusEl=$('status'),prog=$('prog');
  var speakBtn=$('speak'),pauseBtn=$('pause'),stopBtn=$('stop');
  var voices=[],queueId=0,paused=false,curAudio=null;

  // [コード, 表示名, Google翻訳の言語コード, 女性の声, 男性の声]
  var LANGS=[
    ['ja-JP','日本語','ja','Mizuki','Takumi'],
    ['en-US','英語（アメリカ）','en','Joanna','Matthew'],
    ['en-GB','英語（イギリス）','en','Amy','Brian'],
    ['en-AU','英語（オーストラリア）','en','Nicole','Russell'],
    ['en-IN','英語（インド）','en','Raveena',''],
    ['zh-CN','中国語（簡体）','zh-CN','Zhiyu',''],
    ['zh-TW','中国語（繁体）','zh-TW','',''],
    ['ko-KR','韓国語','ko','Seoyeon',''],
    ['fr-FR','フランス語','fr','Celine','Mathieu'],
    ['de-DE','ドイツ語','de','Marlene','Hans'],
    ['es-ES','スペイン語','es','Conchita','Enrique'],
    ['it-IT','イタリア語','it','Carla','Giorgio'],
    ['pt-BR','ポルトガル語（ブラジル）','pt','Vitoria','Ricardo'],
    ['ru-RU','ロシア語','ru','Tatyana','Maxim']
  ];
  var ENG_NAME={se:'オンライン音声',gt:'Google翻訳の音声',br:'この端末の音声'};

  LANGS.forEach(function(l){var o=document.createElement('option');o.value=l[0];o.textContent=l[1];langSel.appendChild(o)});
  if(!hasBr){for(var k=engSel.options.length-1;k>=0;k--){if(engSel.options[k].value==='br') engSel.remove(k)}}

  function setStatus(msg,err){statusEl.textContent=msg;statusEl.className='status'+(err?' err':'')}
  function nl(l){return String(l||'').replace('_','-')}
  function pre(l){return nl(l).split('-')[0].toLowerCase()}
  function info(){return LANGS.filter(function(l){return l[0]===langSel.value})[0]||LANGS[0]}

  // ---------- 端末の音声（フォールバック用） ----------
  var FEMALE=/female|kyoko|haruka|ayumi|sayaka|nanami|mizuki|o-ren|samantha|victoria|karen|moira|tessa|zira|hazel|susan|jenny|aria|michelle|ting-ting|mei-jia|sin-ji|yuna|amelie|anna|helena|paulina|monica|alice|sara|ioana|kanya|google 日本語|女/i;
  var MALE=/\bmale\b|otoya|ichiro|keita|takumi|daniel|alex\b|fred|\btom\b|david|mark\b|james|\bguy\b|eric|ryan|thomas|jorge|diego|luca|yuri|xander|男/i;
  function genderOf(v){
    var n=v.name;
    if(/female/i.test(n)) return 'female';
    if(MALE.test(n)) return 'male';
    if(FEMALE.test(n)) return 'female';
    return 'unknown';
  }
  function voicesForLang(){
    var code=langSel.value;
    var list=voices.filter(function(v){return nl(v.lang)===code});
    if(!list.length) list=voices.filter(function(v){return pre(v.lang)===pre(code)});
    return list;
  }
  function fillVoices(){
    voiceSel.innerHTML='';
    var auto=document.createElement('option'); auto.value=''; auto.textContent='自動選択'; voiceSel.appendChild(auto);
    voicesForLang().forEach(function(v){
      var o=document.createElement('option'); o.value=v.name+'||'+v.lang;
      var g=genderOf(v); o.textContent=v.name+(g==='female'?'（女性）':g==='male'?'（男性）':''); voiceSel.appendChild(o);
    });
    if(voiceSel.options.length===1) voiceSel.options[0].textContent='この端末に'+info()[1]+'の音声がありません';
  }
  function pickVoice(){
    var list=voicesForLang(); if(!list.length) return null;
    if(engSel.value==='br'&&voiceSel.value){
      for(var i=0;i<list.length;i++){if(list[i].name+'||'+list[i].lang===voiceSel.value) return list[i]}
    }
    var g=genderSel.value;
    if(g!=='any'){var f=list.filter(function(v){return genderOf(v)===g}); if(f.length) list=f}
    return list[0];
  }
  function loadVoices(){
    if(!hasBr) return;
    var pv=voiceSel.value; voices=synth.getVoices()||[]; fillVoices();
    for(var i=0;i<voiceSel.options.length;i++){if(voiceSel.options[i].value===pv){voiceSel.selectedIndex=i;break}}
  }
  if(hasBr){
    loadVoices();
    if(synth.onvoiceschanged!==undefined) synth.onvoiceschanged=loadVoices;
    var tries=0, poll0=setInterval(function(){loadVoices(); if(voices.length||++tries>20) clearInterval(poll0)},300);
  }

  function updateUI(){
    var br=engSel.value==='br';
    voiceRow.hidden=!br; pitch.disabled=!br;
  }
  langSel.addEventListener('change',fillVoices);
  genderSel.addEventListener('change',fillVoices);
  engSel.addEventListener('change',updateUI);
  rate.addEventListener('input',function(){$('rateOut').textContent=Number(rate.value).toFixed(1)+'倍'});
  pitch.addEventListener('input',function(){$('pitchOut').textContent=Number(pitch.value).toFixed(1)});
  text.addEventListener('input',function(){$('count').textContent=text.value.length.toLocaleString('ja-JP')+'文字'});
  text.addEventListener('keydown',function(e){if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();speak()}});
  updateUI();

  // ---------- 文章を短く区切る ----------
  function split(s){
    var parts=s.match(/[^。！？!?．.\n]+[。！？!?．.]*\n*|\n+/g)||[s];
    var out=[];
    parts.forEach(function(p){
      p=p.trim(); if(!p) return;
      while(p.length>120){
        var cut=p.lastIndexOf('、',120); if(cut<40) cut=p.lastIndexOf(',',120); if(cut<40) cut=p.lastIndexOf(' ',120); if(cut<40) cut=120;
        out.push(p.slice(0,cut+1)); p=p.slice(cut+1).trim();
      }
      if(p) out.push(p);
    });
    return out;
  }

  function setPlaying(on){
    pauseBtn.disabled=!on; stopBtn.disabled=!on;
    if(!on){paused=false;pauseBtn.textContent='一時停止'}
  }
  function stopAll(){
    queueId++;
    if(curAudio){var a=curAudio;curAudio=null;a.onended=a.onerror=a.onplaying=null;try{a.pause()}catch(e){}}
    if(hasBr) synth.cancel();
  }

  // ---------- 読み上げ ----------
  function speak(){
    var s=text.value.trim();
    if(!s){setStatus('テキストを入力してください。',true);text.focus();return}
    var busy=hasBr&&(synth.speaking||synth.pending);
    stopAll();
    if(hasBr&&synth.paused){try{synth.resume()}catch(e){}}
    var id=queueId, chunks=split(s), i=0, L=info();
    var order=engSel.value==='auto'?['se','gt','br']:[engSel.value];
    if(!hasBr) order=order.filter(function(x){return x!=='br'});
    var seName=genderSel.value==='male'?(L[4]||L[3]):(L[3]||L[4]);
    var rt=Number(rate.value);
    paused=false; pauseBtn.textContent='一時停止';
    setPlaying(true); prog.style.width='0'; setStatus('準備中…');

    function fail(msg){stopAll();setPlaying(false);setStatus(msg,true)}
    function next(){i++;prog.style.width=Math.round(i/chunks.length*100)+'%';playChunk()}
    function drop(msg){
      order.shift();
      if(order.length) setStatus(msg+'別の方法に切り替えます…');
      playChunk();
    }

    function playChunk(){
      if(id!==queueId) return;
      if(i>=chunks.length){setPlaying(false);prog.style.width='100%';setStatus('読み上げが終わりました。');return}
      if(!order.length){fail('読み上げに使える方法がありません。インターネット接続を確認するか、別の言語・取得方法をお試しください。');return}
      var eng=order[0], txt=chunks[i];
      if(eng==='br') return playBrowser(txt);
      if(eng==='se'&&!seName){order.shift();return playChunk()}
      var url= eng==='se'
        ? 'https://api.streamelements.com/kappa/v2/speech?voice='+encodeURIComponent(seName)+'&text='+encodeURIComponent(txt)
        : 'https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl='+encodeURIComponent(L[2])+'&q='+encodeURIComponent(txt);
      var a=new Audio(), done=false, timer=null;
      curAudio=a; a.preload='auto'; a.src=url;
      a.defaultPlaybackRate=rt; a.playbackRate=rt;
      a.preservesPitch=true; a.mozPreservesPitch=true; a.webkitPreservesPitch=true;
      function guard(ms,fn){clearTimeout(timer);timer=setTimeout(function w(){if(paused){timer=setTimeout(w,2000);return}fn()},ms)}
      function ok(){if(done)return;done=true;clearTimeout(timer);if(id!==queueId)return;next()}
      function bad(){
        if(done)return;done=true;clearTimeout(timer);if(id!==queueId)return;
        a.onended=a.onerror=a.onplaying=null;try{a.pause()}catch(e){}
        drop(ENG_NAME[eng]+'を取得できませんでした。');
      }
      a.onplaying=function(){setStatus('読み上げ中（'+ENG_NAME[eng]+'）… '+(i+1)+' / '+chunks.length);guard(60000,function(){try{a.pause()}catch(e){}ok()})};
      a.onended=ok;
      a.onerror=bad;
      guard(12000,bad);
      setStatus('音声を取得中（'+ENG_NAME[eng]+'）…');
      var pr=a.play();
      if(pr&&pr.catch) pr.catch(function(e){
        if(done||id!==queueId) return;
        if(e&&e.name==='NotAllowedError'){done=true;clearTimeout(timer);fail('ブラウザが音声の再生を許可していません。もう一度ボタンを押してください。')}
        else bad();
      });
    }

    function playBrowser(txt){
      curAudio=null;
      var v=pickVoice();
      if(!v){drop('この端末には'+L[1]+'の音声がありません。');return}
      var done=false,started=false,t0=Date.now(),poll=null;
      var u=new SpeechSynthesisUtterance(txt);
      u.voice=v; u.lang=nl(v.lang); u.rate=rt; u.pitch=Number(pitch.value);
      function stopPoll(){clearInterval(poll)}
      function adv(){if(done)return;done=true;stopPoll();if(id!==queueId)return;next()}
      function bad(m){if(done)return;done=true;stopPoll();if(id!==queueId)return;synth.cancel();drop(m)}
      u.onstart=function(){started=true;setStatus('読み上げ中（'+ENG_NAME.br+'）… '+(i+1)+' / '+chunks.length)};
      u.onend=adv;
      u.onerror=function(e){
        if(done||id!==queueId||e.error==='canceled'||e.error==='interrupted') return;
        if(e.error==='not-allowed'){done=true;stopPoll();fail('ブラウザが音声の再生を許可していません。もう一度ボタンを押してください。');return}
        bad('端末の音声で読み上げに失敗しました。');
      };
      poll=setInterval(function(){
        if(done||id!==queueId){stopPoll();return}
        if(paused){t0+=300;return}
        if(synth.speaking) started=true;
        if(started&&!synth.speaking&&!synth.pending){adv();return}
        var el=Date.now()-t0;
        if(!started&&el>10000) bad('端末の音声が再生されませんでした。');
        else if(el>30000+txt.length*500/rt){done=true;stopPoll();synth.cancel();next()}
      },300);
      setStatus('読み上げ中（'+ENG_NAME.br+'）… '+(i+1)+' / '+chunks.length);
      synth.speak(u);
    }

    if(busy) setTimeout(playChunk,150); else playChunk();
  }

  speakBtn.addEventListener('click',speak);
  stopBtn.addEventListener('click',function(){stopAll();setPlaying(false);prog.style.width='0';setStatus('停止しました。')});
  pauseBtn.addEventListener('click',function(){
    if(!paused){
      paused=true; if(curAudio) curAudio.pause(); else if(hasBr) synth.pause();
      pauseBtn.textContent='再開'; setStatus('一時停止中');
    }else{
      paused=false; if(curAudio){var p=curAudio.play(); if(p&&p.catch) p.catch(function(){})} else if(hasBr) synth.resume();
      pauseBtn.textContent='一時停止'; setStatus('読み上げ中…');
    }
  });
  window.addEventListener('beforeunload',function(){stopAll()});
})();
</script>
</body>
</html>
